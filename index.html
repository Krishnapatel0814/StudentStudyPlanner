```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: #4f46e5;
            color: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
        }

        #darkModeBtn {
            background: white;
            color: #4f46e5;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* MAIN */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .stat-card h2 {
            font-size: 30px;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
        }

        /* ADD TASK */
        .task-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .task-form h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .add-btn {
            margin-top: 15px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        /* PROGRESS */
        .progress-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 12px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #4f46e5;
            transition: width 0.3s ease;
        }

        /* SEARCH & FILTER */
        .tools {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tools input {
            flex: 1;
        }

        .tools select {
            width: 180px;
        }

        /* TASK LIST */
        .tasks-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .tasks-container h2 {
            margin-bottom: 20px;
        }

        #taskList {
            list-style: none;
        }

        .task-item {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
        }

        .task-left input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            cursor: pointer;
        }

        .task-info h3 {
            margin-bottom: 7px;
        }

        .task-info p {
            color: #777;
            font-size: 13px;
        }

        .completed h3 {
            text-decoration: line-through;
            color: #999;
        }

        .badges {
            display: flex;
            gap: 7px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .subject-badge {
            background: #eef2ff;
            color: #4f46e5;
        }

        .high {
            background: #fee2e2;
            color: #dc2626;
        }

        .medium {
            background: #fef3c7;
            color: #d97706;
        }

        .low {
            background: #dcfce7;
            color: #16a34a;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }

        /* DARK MODE */
        body.dark {
            background: #111827;
            color: #f9fafb;
        }

        body.dark .stat-card,
        body.dark .task-form,
        body.dark .progress-box,
        body.dark .tasks-container {
            background: #1f2937;
        }

        body.dark .stat-card p,
        body.dark .task-info p {
            color: #aaa;
        }

        body.dark .task-item {
            border-color: #374151;
        }

        body.dark input,
        body.dark select {
            background: #111827;
            color: white;
            border-color: #374151;
        }

        body.dark .progress-bar {
            background: #374151;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tools {
                flex-direction: column;
            }

            .tools select {
                width: 100%;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <div>
            <h1>📚 Student Study Planner</h1>
            <p>Plan your studies. Track your progress. Achieve your goals.</p>
        </div>

        <button id="darkModeBtn" onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>

    </header>


    <main class="container">

        <!-- STATISTICS -->
        <section class="stats">

            <div class="stat-card">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </section>


        <!-- ADD TASK -->
        <section class="task-form">

            <h2>➕ Add New Study Task</h2>

            <div class="form-grid">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter task..."
                >

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Subject"
                >

                <select id="priorityInput">

                    <option value="Low">Low Priority</option>

                    <option value="Medium" selected>
                        Medium Priority
                    </option>

                    <option value="High">
                        High Priority
                    </option>

                </select>

                <input
                    type="date"
                    id="deadlineInput"
                >

            </div>

            <button class="add-btn" onclick="addTask()">
                Add Task
            </button>

        </section>


        <!-- PROGRESS -->
        <section class="progress-box">

            <div class="progress-header">

                <strong>📊 Overall Progress</strong>

                <strong>
                    <span id="progress">0</span>%
                </strong>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </section>


        <!-- SEARCH AND FILTER -->
        <div class="tools">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
                oninput="displayTasks()"
            >

            <select id="filterInput" onchange="displayTasks()">

                <option value="all">
                    All Tasks
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>


        <!-- TASK LIST -->
        <section class="tasks-container">

            <h2>📝 My Tasks</h2>

            <ul id="taskList"></ul>

        </section>

    </main>


    <footer>
        <p>Student Study Planner • Built with HTML, CSS & JavaScript</p>
    </footer>


    <script>

        /* =========================
           LOAD SAVED TASKS
        ========================= */

        let tasks =
            JSON.parse(localStorage.getItem("tasks")) || [];


        /* =========================
           ADD TASK
        ========================= */

        function addTask() {

            const taskInput =
                document.getElementById("taskInput");

            const subjectInput =
                document.getElementById("subjectInput");

            const priorityInput =
                document.getElementById("priorityInput");

            const deadlineInput =
                document.getElementById("deadlineInput");


            const taskText =
                taskInput.value.trim();

            const subject =
                subjectInput.value.trim();

            const priority =
                priorityInput.value;

            const deadline =
                deadlineInput.value;


            if (taskText === "") {

                alert("Please enter a task!");

                return;
            }


            const newTask = {

                id: Date.now(),

                text: taskText,

                subject:
                    subject || "General",

                priority: priority,

                deadline:
                    deadline || "No deadline",

                completed: false
            };


            tasks.push(newTask);


            saveTasks();

            displayTasks();


            /* Clear inputs */

            taskInput.value = "";

            subjectInput.value = "";

            priorityInput.value = "Medium";

            deadlineInput.value = "";

        }


        /* =========================
           DISPLAY TASKS
        ========================= */

        function displayTasks() {

            const taskList =
                document.getElementById("taskList");

            const searchText =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();

            const filter =
                document
                    .getElementById("filterInput")
                    .value;


            taskList.innerHTML = "";


            let filteredTasks = tasks.filter(function(task) {

                const matchesSearch =
                    task.text
                        .toLowerCase()
                        .includes(searchText) ||

                    task.subject
                        .toLowerCase()
                        .includes(searchText);


                let matchesFilter = true;


                if (filter === "completed") {

                    matchesFilter =
                        task.completed === true;
                }


                if (filter === "pending") {

                    matchesFilter =
                        task.completed === false;
                }


                return matchesSearch && matchesFilter;

            });


            if (filteredTasks.length === 0) {

                taskList.innerHTML = `
                    <div class="empty">
                        <h3>📭 No tasks found</h3>
                        <p>Add a study task to get started.</p>
                    </div>
                `;

                updateStats();

                return;
            }


            filteredTasks.forEach(function(task) {

                const li =
                    document.createElement("li");


                li.className = "task-item";


                if (task.completed) {

                    li.classList.add("completed");
                }


                li.innerHTML = `

                    <div class="task-left">

                        <input
                            type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="completeTask(${task.id})"
                        >

                        <div class="task-info">

                            <h3>
                                ${escapeHTML(task.text)}
                            </h3>

                            <p>
                                📅 Deadline:
                                ${formatDate(task.deadline)}
                            </p>

                            <div class="badges">

                                <span class="badge subject-badge">
                                    📚 ${escapeHTML(task.subject)}
                                </span>

                                <span class="badge ${task.priority.toLowerCase()}">
                                    ${task.priority} Priority
                                </span>

                            </div>

                        </div>

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        🗑️ Delete
                    </button>

                `;


                taskList.appendChild(li);

            });


            updateStats();

        }


        /* =========================
           COMPLETE TASK
        ========================= */

        function completeTask(id) {

            tasks =
                tasks.map(function(task) {

                    if (task.id === id) {

                        task.completed =
                            !task.completed;
                    }

                    return task;

                });


            saveTasks();

            displayTasks();

        }


        /* =========================
           DELETE TASK
        ========================= */

        function deleteTask(id) {

            const confirmDelete =
                confirm("Delete this task?");


            if (!confirmDelete) {

                return;
            }


            tasks =
                tasks.filter(function(task) {

                    return task.id !== id;

                });


            saveTasks();

            displayTasks();

        }


        /* =========================
           SAVE TASKS
        ========================= */

        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        /* =========================
           UPDATE STATISTICS
        ========================= */

        function updateStats() {

            const total =
                tasks.length;


            const completed =
                tasks.filter(function(task) {

                    return task.completed;

                }).length;


            const pending =
                total - completed;


            document.getElementById(
                "totalTasks"
            ).innerText = total;


            document.getElementById(
                "completedTasks"
            ).innerText = completed;


            document.getElementById(
                "pendingTasks"
            ).innerText = pending;


            let percentage = 0;


            if (total > 0) {

                percentage =
                    Math.round(
                        (completed / total) * 100
                    );

            }


            document.getElementById(
                "progress"
            ).innerText = percentage;


            document.getElementById(
                "progressFill"
            ).style.width =
                percentage + "%";

        }


        /* =========================
           FORMAT DATE
        ========================= */

        function formatDate(date) {

            if (!date ||
                date === "No deadline") {

                return "No deadline";
            }


            const parts =
                date.split("-");


            return `${parts[2]}-${parts[1]}-${parts[0]}`;

        }


        /* =========================
           DARK MODE
        ========================= */

        function toggleDarkMode() {

            document.body.classList.toggle("dark");


            const button =
                document.getElementById(
                    "darkModeBtn"
                );


            if (
                document.body.classList.contains("dark")
            ) {

                button.innerText =
                    "☀️ Light Mode";

            } else {

                button.innerText =
                    "🌙 Dark Mode";

            }

        }


        /* =========================
           SECURITY HELPER
        ========================= */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* =========================
           INITIAL DISPLAY
        ========================= */

        displayTasks();

    </script>

</body>
</html>
